<!doctype html>
<html><head><meta charset="utf-8"><title>Tests</title>
<style>body{font:14px/1.4 monospace;white-space:pre;padding:16px;background:#111;color:#eee}</style>
</head><body><div id="out">running…</div>
<script type="module">
  import { runAll } from './harness.js';
  // Import every test module so its test() calls register:
  await import('./smoke.test.js');
  await import('./aabb.test.js');
  await import('./input.test.js');
  await import('./loop.test.js');
  await import('./game-state.test.js');
  await import('./level-format.test.js');
  await import('./player-jump.test.js');
  await import('./world-timer.test.js');
  await import('./tiles.test.js');
  await import('./enemy-collision.test.js');
  await import('./koopa.test.js');
  await import('./lifecycle.test.js');
  await import('./pickups.test.js');
  await import('./fireball.test.js');
  await import('./determinism.test.js');
  await import('./renderer-readonly.test.js');
  await import('./flagpole.test.js');
  await import('./flag-slide.test.js');
  await import('./flag-bonus.test.js');
  await import('./extras.test.js');
  await import('./audio.test.js');
  await import('./levels-load.test.js');
  await import('./schema.test.js');
  await import('./handles.test.js');
  await import('./identity.test.js');
  await import('./transport.test.js');
  await import('./social.test.js');
  await import('./social-overlay.test.js');
  await import('./display.test.js');
  await import('./hitstop.test.js');
  await import('./effects.test.js');
  await import('./fx-overlay.test.js');
  await import('./events-coords.test.js');
  await import('./camera.test.js');
  await import('./renderer-extras.test.js');
  await import('./crt.test.js');
  await import('./ecs-entity.test.js');
  await import('./ecs-systems.test.js');
  await import('./ecs-components.test.js');
  await import('./ecs-loader.test.js');
  await import('./ecs-view.test.js');
  await import('./ecs-world.test.js');
  await import('./classic-adapter.test.js');
  await import('./sim-factory.test.js');
  await import('./ecs-determinism.test.js');
  await import('./ecs-jump.test.js');
  await import('./ecs-mechanics.test.js');
  await import('./ecs-respawn.test.js');
  await import('./ecs-determinism-2.test.js');
  await import('./ecs-editor-serialize.test.js');
  await import('./ecs-editor-model.test.js');
  const out = document.getElementById('out');
  await runAll(out);
  // Headless runner hook: when loaded with ?post=1, POST the summary text to the
  // shot server so a CLI/subagent can read it (this Chrome's new-headless mode
  // does not support --dump-dom). No effect on normal browser runs.
  if (location.search.includes('post')) {
    try {
      await fetch('/shot?name=testresult.txt', { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: btoa(unescape(encodeURIComponent(out.textContent))) });
    } catch (e) {}
  }
</script>
</body></html>
