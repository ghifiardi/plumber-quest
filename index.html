<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Plumber Quest</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="frame">
  <canvas id="game" width="256" height="240"></canvas>
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <button id="crt" aria-label="Toggle CRT effect">📺</button>

  <!-- Social (opt-in online play). Controls are DOM, like #mute. -->
  <button id="social-toggle" aria-label="Toggle online play">SEE WHO'S ONLINE</button>
  <button id="callout-btn" aria-label="Send a callout" hidden>📣</button>
  <div id="social-handle" hidden><span id="handle-name"></span><button id="reroll" aria-label="New name">⟳</button><button id="reset-id" aria-label="Reset online identity">⌫</button></div>
  <div id="callout-menu" hidden></div>
  <div id="social-notice" hidden>
    <p>Online mode shares a random player ID and handle, your online status, preset callouts, and level-clear or one-up events. No email or free-text chat. Turn it off anytime.</p>
    <button id="notice-ok">Go online</button><button id="notice-cancel">Not now</button>
  </div>

  <!-- On-screen touch controls (shown only on touch / coarse-pointer devices). -->
  <div id="touch-controls" aria-hidden="true">
    <div class="pad">
      <button class="tc-btn dpad" data-action="left"  aria-label="Move left">◀</button>
      <button class="tc-btn dpad" data-action="right" aria-label="Move right">▶</button>
    </div>
    <div class="ab">
      <button class="tc-btn b" data-action="b" aria-label="Run and fire">B</button>
      <button class="tc-btn a" data-action="a" aria-label="Jump">A</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body></html>
