name: Build Android App Bundle

# Builds a signed Android App Bundle (.aab) ready to upload to the Google
# Play Console. Run it manually from the Actions tab, or it runs automatically
# when you push a tag like `v1.0.0`.
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    - your upload keystore, base64-encoded
#   KEYSTORE_PASSWORD  - the keystore (store) password
#   KEY_ALIAS          - the key alias inside the keystore
#   KEY_PASSWORD       - the key password
# See docs/PLAY_STORE.md for how to generate these.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.0.1). Leave blank to keep build.gradle value."
        required: false
        default: ""
      versionCode:
        description: "Version code (integer, must increase each upload). Leave blank to keep build.gradle value."
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Assemble web assets and sync Capacitor
        run: npm run sync

      - name: Apply version overrides
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.versionName != '' || inputs.versionCode != '') }}
        run: |
          GRADLE=android/app/build.gradle
          if [ -n "${{ inputs.versionName }}" ]; then
            sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.versionName }}\"/" "$GRADLE"
          fi
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.versionCode }}/" "$GRADLE"
          fi
          grep -E "versionName|versionCode" "$GRADLE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See docs/PLAY_STORE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: plumber-quest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Also build APK (for sideloading / quick testing)
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plumber-quest-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
